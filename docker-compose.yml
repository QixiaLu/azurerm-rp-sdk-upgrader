services:
  upgrader:
    build: .
    image: upgrader-sandbox
    # Mount your azurerm fork; the upgrade edits it in place and writes .upgrader/ inside it.
    volumes:
      - ${AZURERM_REPO:-./terraform-provider-azurerm}:/workspace/azurerm
      # Cache Go modules between runs so vendor/tidy isn't redownloaded each time.
      - go-mod-cache:/go/pkg/mod
    environment:
      # Copilot auth (required). Azure/TeamCity vars only needed for later stages.
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    env_file:
      - .env
    # Override args at run time: docker compose run upgrader <rp> <ver> --repo /workspace/azurerm ...
    command: ["--help"]

volumes:
  go-mod-cache:
