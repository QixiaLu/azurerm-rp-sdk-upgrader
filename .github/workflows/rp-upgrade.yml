# Runs the RP API-version upgrade loop against a fork of terraform-provider-azurerm and
# pushes the result to a branch so progress survives the ephemeral runner.
#
# Model of operation (see README "Constraints (by design)"):
#   - The Copilot agent only EDITS files; it never commits/pushes (no-VCS guard).
#   - The runner's own checkout is the isolation boundary, so this workflow does the single
#     commit + push at the end.
#
# This workflow lives in the UPGRADER repo and targets a separate azurerm fork that you
# pass in as `fork_repo` (e.g. your-user/terraform-provider-azurerm). The result is pushed
# back to a branch on that fork.
name: RP API upgrade

on:
  workflow_dispatch:
    inputs:
      fork_repo:
        description: owner/name of your azurerm fork (e.g. your-user/terraform-provider-azurerm)
        required: true
      rp_name:
        description: Service short name (e.g. keyvault)
        required: true
      target_api_version:
        description: Target API version (e.g. 2023-07-01)
        required: true
      old_api_version:
        description: Version to upgrade from (blank = auto-detect)
        required: false
        default: ""
      model:
        description: Copilot model
        required: false
        default: claude-sonnet-4.5
      skip_acctest:
        description: Stop once the build is green (skip acceptance-test triage)
        type: boolean
        default: true

# permissions: the auto GITHUB_TOKEN only needs to READ this (runner) repo to check out
# the upgrader tool. It grants NOTHING on the fork — the fork push is authenticated
# separately by FORK_PUSH_TOKEN (a PAT with contents:write on the fork).
permissions:
  contents: read

# One in-flight run per (rp, version); don't cancel a run mid-provision.
concurrency:
  group: rp-upgrade-${{ inputs.rp_name }}-${{ inputs.target_api_version }}
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 720 # acctest provisions real resources and can run for hours
    environment: COPILOT_TOKEN
    env:
      # Copilot auth only — used inside the container for the SDK sessions.
      GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
      # Azure creds — only consumed when acctest runs (skip_acctest=false).
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_TEST_LOCATION: ${{ vars.ARM_TEST_LOCATION }}
      ARM_TEST_LOCATION_ALT: ${{ vars.ARM_TEST_LOCATION_ALT }}
      ARM_TEST_LOCATION_ALT2: ${{ vars.ARM_TEST_LOCATION_ALT2 }}
      # TeamCity baseline for acctest triage (optional).
      TEAMCITY_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
      BRANCH: upgrade/${{ inputs.rp_name }}-${{ inputs.target_api_version }}

    steps:
      - name: Check out your azurerm fork (full history so we can branch + push)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.fork_repo }}
          token: ${{ secrets.FORK_PUSH_TOKEN }} # PAT with contents:write on the fork
          path: azurerm
          fetch-depth: 0

      - name: Check out the upgrader tool (this repo)
        uses: actions/checkout@v4
        with:
          path: upgrader-tool

      - name: Build the sandbox image
        run: docker build -t upgrader-sandbox upgrader-tool

      - name: Run the upgrade loop (agent edits the checkout in place, never commits)
        run: |
          docker run --rm \
            -e GH_TOKEN \
            -e ARM_CLIENT_ID -e ARM_CLIENT_SECRET -e ARM_SUBSCRIPTION_ID -e ARM_TENANT_ID \
            -e ARM_TEST_LOCATION -e ARM_TEST_LOCATION_ALT -e ARM_TEST_LOCATION_ALT2 \
            -e TEAMCITY_TOKEN \
            -v "${{ github.workspace }}/azurerm:/workspace/azurerm" \
            upgrader-sandbox \
            "${{ inputs.rp_name }}" "${{ inputs.target_api_version }}" \
            --repo /workspace/azurerm \
            --model "${{ inputs.model }}" \
            --verbose \
            ${{ inputs.old_api_version != '' && format('--old-api-version {0}', inputs.old_api_version) || '' }} \
            ${{ inputs.skip_acctest && '--skip-acctest' || '' }}

      # The container runs as root, so new files are root-owned; reclaim them and tell git
      # this checkout is trusted before we commit.
      - name: Reclaim file ownership
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}/azurerm"
          git config --global --add safe.directory "${{ github.workspace }}/azurerm"

      - name: Commit & push the result (CI does VCS — never the agent)
        if: always()
        working-directory: azurerm
        run: |
          git config user.name  "rp-upgrade-bot"
          git config user.email "rp-upgrade-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Keep the .upgrader/ run artifacts out of the pushed branch (optional).
          git add -A -- ':!.upgrader' ':!.acctest-run'
          if git diff --cached --quiet; then
            echo "No changes produced — nothing to push."
            exit 0
          fi
          git commit -m "Upgrade ${{ inputs.rp_name }} to API ${{ inputs.target_api_version }} (automated)"
          git push --force-with-lease -u origin "$BRANCH"
          echo "Pushed $BRANCH — open a PR from it for human review."

      # Optional: also archive the per-run logs/result.json so a failed run is debuggable.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrader-run-${{ inputs.rp_name }}-${{ inputs.target_api_version }}
          path: |
            ${{ github.workspace }}/azurerm/.upgrader/**
            ${{ github.workspace }}/azurerm/.acctest-run/**
          if-no-files-found: ignore
